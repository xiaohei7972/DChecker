# Build an installable debug APK on the fork without release-signing or Telegram secrets.
name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read Android toolchain settings
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          properties = {}
          for raw_line in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              properties[key.strip()] = value.strip()

          mapping = {
              "build_tools": "duckdetector.android.buildTools",
              "cmake": "duckdetector.android.cmake",
              "compile_sdk": "duckdetector.android.compileSdk",
              "compile_sdk_minor": "duckdetector.android.compileSdkMinor",
              "ndk": "duckdetector.android.ndk",
          }

          for output_name, property_name in mapping.items():
              value = properties.get(property_name)
              if not value:
                  raise SystemExit(f"Missing required Gradle property: {property_name}")
              print(f"{output_name}={value}")
          PY

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: false

      - name: Install Android SDK packages
        shell: bash
        env:
          BUILD_TOOLS: ${{ steps.toolchain.outputs.build_tools }}
          CMAKE: ${{ steps.toolchain.outputs.cmake }}
          COMPILE_SDK: ${{ steps.toolchain.outputs.compile_sdk }}
          COMPILE_SDK_MINOR: ${{ steps.toolchain.outputs.compile_sdk_minor }}
          NDK: ${{ steps.toolchain.outputs.ndk }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -mindepth 2 -maxdepth 3 -type f -name sdkmanager -print -quit)"
          if [ -z "$sdkmanager_bin" ]; then
            echo "Android sdkmanager is missing from $sdk_root/cmdline-tools" >&2
            exit 1
          fi

          # The hosted runner has command-line tools but does not put sdkmanager on PATH.
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null
          set -o pipefail

          packages=(
            "platform-tools"
            "platforms;android-${COMPILE_SDK}.${COMPILE_SDK_MINOR}"
            "build-tools;${BUILD_TOOLS}"
            "cmake;${CMAKE}"
            "ndk;${NDK}"
          )

          for attempt in 1 2 3; do
            if "$sdkmanager_bin" --install "${packages[@]}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Android SDK package installation failed after ${attempt} attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -Pduckdetector.githubContributors.maxAttempts=1

      - name: Test Home language formatting
        run: ./gradlew :app:testDebugUnitTest --tests com.dchecker.info.features.dashboard.ui.model.DashboardUiStateTest --no-daemon --stacktrace -Pduckdetector.githubContributors.maxAttempts=1

      - name: Upload debug APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: DChecker-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
